name: Android APK derle
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install
      - run: npm run vendor
      - run: node scripts/fixtures.mjs
      - uses: actions/cache@v4
        with:
          path: gdtf-cache
          key: gdtf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdtf-${{ runner.os }}-
      - run: node scripts/gdtf.mjs
        env:
          GDTF_USER: ${{ secrets.GDTF_USER }}
          GDTF_PASS: ${{ secrets.GDTF_PASS }}
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#16191D' --iconBackgroundColorDark '#16191D' --splashBackgroundColor '#16191D' --splashBackgroundColorDark '#16191D'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk isik-plani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: isik-plani-android
          path: |
            isik-plani.apk
            ofl-kutuphane.json
            gdtf-kutuphane.json
