name: Android APK derle
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_UPLOAD_KEYSTORE != '' }}
      HAS_PLAY_API: ${{ secrets.PLAY_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Imza anahtari (her derlemede ayni imza; guncelleme ustune kurulabilsin)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "Sabit imza kullaniliyor"; else echo "UYARI: ANDROID_DEBUG_KEYSTORE tanimli degil; APK her derlemede farkli imzalanir"; fi
      - run: npm install
      - run: npm run vendor
      - run: node scripts/fixtures.mjs
      - uses: actions/cache@v4
        with:
          path: gdtf-cache
          key: gdtf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gdtf-${{ runner.os }}-
      - run: node scripts/gdtf.mjs
        env:
          GDTF_USER: ${{ secrets.GDTF_USER }}
          GDTF_PASS: ${{ secrets.GDTF_PASS }}
          FX_DETAIL: '0'
      - name: Surum numarasi
        id: v
        run: node -e "const p=require('./package.json'),[a,b]=p.version.split('.'),v=a+'.'+b+'.'+process.env.GITHUB_RUN_NUMBER,fs=require('fs');fs.writeFileSync('www/build-info.js','window.BUILD_INFO='+JSON.stringify({v,platform:'android',repo:process.env.GITHUB_REPOSITORY})+';');fs.appendFileSync(process.env.GITHUB_OUTPUT,'v='+v+'\n');console.log('Surum',v)"
      - run: npx cap add android
      - run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.v }}\"/" android/app/build.gradle
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#16191D' --iconBackgroundColorDark '#16191D' --splashBackgroundColor '#16191D' --splashBackgroundColorDark '#16191D'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk isik-plani.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.v }}
          name: Işık Planı ${{ steps.v.outputs.v }} (Android)
          files: |
            isik-plani.apk
            ofl-kutuphane.json
            gdtf-kutuphane.json
      # ---------- Google Play (AAB) ----------
      - name: Play paketi (AAB) derle ve imzala
        if: env.HAS_PLAY_KEY == 'true'
        env:
          KS: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PW: ${{ secrets.PLAY_UPLOAD_PASSWORD }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('www/build-info.js','window.BUILD_INFO='+JSON.stringify({v:'${{ steps.v.outputs.v }}',platform:'android',store:'play',repo:process.env.GITHUB_REPOSITORY})+';')"
          npx cap copy android
          cd android && ./gradlew bundleRelease && cd ..
          echo "$KS" | base64 -d > upload.jks
          cp android/app/build/outputs/bundle/release/app-release.aab isik-plani-play.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$PW" -keypass "$PW" isik-plani-play.aab upload
          jarsigner -verify isik-plani-play.aab
          rm -f upload.jks
      - name: Google Play'e yukle (dahili test)
        if: env.HAS_PLAY_KEY == 'true' && env.HAS_PLAY_API == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.isikplani.app
          releaseFiles: isik-plani-play.aab
          releaseName: ${{ steps.v.outputs.v }}
          track: internal
          status: completed
      - uses: actions/upload-artifact@v4
        if: env.HAS_PLAY_KEY == 'true'
        with:
          name: isik-plani-play-aab
          path: isik-plani-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: isik-plani-android
          path: |
            isik-plani.apk
            ofl-kutuphane.json
            gdtf-kutuphane.json
