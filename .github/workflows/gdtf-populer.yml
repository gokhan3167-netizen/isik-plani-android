name: GDTF populer cihazlar (3D model kaynagi)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: GDTF Share'den indir
        env:
          GDTF_USER: ${{ secrets.GDTF_USER }}
          GDTF_PASS: ${{ secrets.GDTF_PASS }}
        run: node scripts/gdtf-populer.mjs
      - name: Taslak (gizli) surume koy - yalniz depo yoneticileri gorur, is bitince silinir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd gdtf-populer && zip -q -r ../gdtf-populer.zip . && cd ..
          ls -la gdtf-populer.zip
          gh release delete gdtf-ham-gecici -y --cleanup-tag 2>/dev/null || true
          gh release create gdtf-ham-gecici gdtf-populer.zip --draft --title "GDTF ham (gecici, taslak)" --notes "Gecici. Donusturme bitince silinir."
